name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar o executável
        shell: pwsh
        run: .\build.ps1 -NoInstaller

      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Gerar o instalador
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeIndicator-instalador
          path: dist/*.exe
          if-no-files-found: error

      - name: Publicar o executável portátil como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeIndicator-portatil
          path: publish/ClaudeIndicator.exe
          if-no-files-found: error

      # Todo push na main atualiza a pré-release "latest": o instalador do último commit
      # fica sempre disponível na caixa Releases da página inicial do repositório.
      # Atualizar no lugar (em vez de apagar e recriar) mantém o link estável e não depende
      # da remoção da tag ter propagado.
      - name: Atualizar a release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $setup = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $xml = [xml](Get-Content src/ClaudeIndicator/ClaudeIndicator.csproj)
          $version = @($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $title = "Build $version (main)"
          $notes = "Instalador gerado automaticamente a partir do ultimo commit na main (versao $version). Para versoes estaveis, use as releases numeradas."

          # A API do GitHub devolve 503 de vez em quando (foi o que derrubou o run #5).
          # Cada chamada tem nova tentativa, e nenhuma delas apaga nada: subir o arquivo com
          # --clobber e editar a release são idempotentes, então repetir é sempre seguro.
          function Invoke-Gh {
            param([string[]]$GhArgs, [int]$Tries = 3)
            for ($i = 1; $i -le $Tries; $i++) {
              $out = & gh @GhArgs 2>&1
              if ($LASTEXITCODE -eq 0) { return $true }
              Write-Host "tentativa $i de $Tries falhou: $out"
              if ($i -lt $Tries) { Start-Sleep -Seconds (5 * $i) }
            }
            return $false
          }

          $exists = Invoke-Gh @('release', 'view', 'latest', '--json', 'tagName') -Tries 2

          if (-not $exists) {
            Write-Host "criando a release latest"
            if (-not (Invoke-Gh @('release', 'create', 'latest', $setup, '--prerelease', '--title', $title, '--notes', $notes))) {
              # pode ter sido criada entre a consulta e agora, ou a consulta falhou por 503:
              # nesse caso o caminho certo é atualizar, não desistir
              Write-Host "create nao passou; tentando atualizar no lugar"
              $exists = $true
            }
          }

          if ($exists) {
            Write-Host "atualizando a release latest"
            if (-not (Invoke-Gh @('release', 'upload', 'latest', $setup, '--clobber'))) { throw "falha ao enviar o instalador" }
            if (-not (Invoke-Gh @('release', 'edit', 'latest', '--title', $title, '--notes', $notes, '--prerelease'))) { throw "falha ao editar a release" }
          }

          # O nome do instalador carrega a versao, entao --clobber nunca substitui o anterior:
          # sem limpar, a release acumula um .exe por build e quem consome nao sabe qual e o atual.
          $current = Split-Path $setup -Leaf
          $names = & gh release view latest --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -eq 0) {
            foreach ($name in $names) {
              if ($name -and $name -ne $current -and $name -like 'ClaudeIndicator-Setup-*.exe') {
                Write-Host "removendo instalador antigo: $name"
                Invoke-Gh @('release', 'delete-asset', 'latest', $name, '--yes') -Tries 2 | Out-Null
              }
            }
          }

          Write-Host "release latest atualizada para $version (asset unico: $current)"

      # Só em tags v*: cria a release numerada com o instalador anexado (link estável).
      - name: Criar a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $setup `
            --title "Claude Indicator $env:GITHUB_REF_NAME" `
            --generate-notes `
            --latest
